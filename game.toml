# game.toml - everything the kit needs to know about Need for Speed: Most
# Wanted (Black Edition, PC) that is not derivable from the binary. Addresses
# are guest addresses in the pinned executable. Values marked "sentinel" are
# not identified yet: they point into the zero-filled section padding after
# .rsrc (0x00a37700-0x00a37fff), which the game never references, so the
# kit's Populous-shaped hooks compile and never fire. Replace each one with a
# real address as the bring-up finds it (see docs/analysis.md).

[game]
id = "nfsmw"
name = "Need for Speed: Most Wanted"
app_name = "SpeedRecomp"
bundle_id = "dev.recompkit.nfsmw"
executable = "speed.exe"
sha256 = "80774c2e5d619b4f120b48d4462896fd504c263399d203a238769cffde1d253c"
image_base = 0x00400000
entry_point = 0x007c4040
guest_root = 'C:\Program Files\EA GAMES\Need for Speed Most Wanted'
# Where a developer checkout finds the game, relative to the repository root.
developer_exe = "original/retail/speed.exe"

[translate]
# Ghidra listing directory holding functions.tsv and functions/*.asm,
# relative to the repository root. tools/analyze.py exports them.
listings = "analysis/decompiled/speed.exe"
# Curated symbols, relative to this directory.
globals = "globals.toml"
# The kit's translator wants a visual-phase counter; this game has none that
# has been audited. Sentinel, and no reads are rewritten.
animation_counter = 0x00a37f00
volatile_reads = []
# Function entries the Ghidra listing lacks. The CRT stores pointers to its
# own helpers in .data and jumps through them (007f0e13 jumps through the slot
# at 00907fac); Ghidra lists neither target, and the translator's pointer scan
# only accepts a 16-byte-aligned destination, which these are not. Relaxing
# that rule is not the answer: 8,344 dwords in this image point into .text at
# 4-byte alignment and decode, nearly all of them noise. The two real entries
# are named here instead.
#
# 007f008e and 00825957 came from running the game: a vtable slot call
# (007ee9fe `call dword ptr [edi + 0x14]`) and a function-pointer call
# (00823380 `call dword ptr [eax]`) each named a .text address the runtime
# had no block for, and reported it as a call to an unknown target. Both are
# real code; neither is 16-byte aligned.
# The four above, plus pointer-referenced helpers found by scanning the image
# (2026-09-17, docs/analysis.md).
# The engine's frame time, 1/60, is one pooled .rdata float with 17 readers.
# The three that set the simulation rate read a slot in the section padding
# instead, which the core.nfsmw mod fills (mods/core/nfsmw/nfsmw.c).
operand_redirects = [
    { at = 0x006612ea, from = 0x008970f0, to = 0x00a37800 },  # FMUL: the real timestep
    { at = 0x0065c78d, from = 0x008970f0, to = 0x00a37800 },  # FLD: GetDebugRealTime
    { at = 0x0065c7d7, from = 0x008970f0, to = 0x00a37800 },  # FLD: GetDebugRealTime
]
entry_points = [
    0x006a8e70,  # a vtable method right after a switch's byte table; Ghidra read it as data
    0x0081a7a6,  # a vtable method in the codec region, missing from the listing
    0x00808f3e,  # table-referenced codec routine
